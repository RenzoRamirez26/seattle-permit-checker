# Fly.io alternative to render.yaml (docs/launch.md). `fly launch --no-deploy --copy-config`, then `fly deploy`.
app = "permitos-api"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  PERMIT_PROXY_HOPS = "1"
  PERMIT_DAILY_PLAN_READS = "6"    # docs/launch.md, Budget: with the asks, $8.92 a month at most
  PERMIT_DAILY_ASK_CALLS = "5"

[http_service]
  internal_port = 8000
  force_https = true          # HTTP is redirected to HTTPS by Fly's edge
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"

[mounts]
  source = "permitos_data"
  destination = "/data"

[[vm]]
  memory = "2gb"
  cpus = 1
