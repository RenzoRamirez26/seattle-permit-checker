name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg   # /api/transcribe tests make WebM, MP4 and Ogg clips
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r ../requirements.txt
      - run: npm ci
      - name: Generated API types match the API
        run: sh scripts/openapi.sh --check
        env:
          PYTHON: python
      - name: Fixtures match the API
        run: python scripts/make-fixtures.py --check
      - run: npm run guard
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PYTHON: python
