# Render Blueprint for the API (docs/launch.md). Render terminates HTTPS and redirects HTTP to HTTPS itself.
# Secrets marked sync: false are typed into the dashboard once; they are never in this file.
services:
  - type: web
    name: permitos-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # 2 GB: faster-whisper base.en and PDF rendering need more than the 512 MB starter
    healthCheckPath: /api/health
    autoDeploy: false
    disk:
      name: checks
      mountPath: /data        # data/checks.sqlite and the daily model-call count survive a deploy
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PERMIT_CORS_ORIGIN
        sync: false           # https://your-domain, the static site's address
      - key: PERMIT_DAILY_MODEL_CALLS
        value: "500"
      - key: PERMIT_PROXY_HOPS
        value: "1"            # Render's proxy adds one X-Forwarded-For entry
      - key: PERMIT_TURNSTILE_SECRET
        sync: false           # optional: leave empty to switch Turnstile off
